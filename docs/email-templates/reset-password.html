<!-- Supabase > Authentication > Email Templates > "Reset password". Subject: Reset your RampRate portal password -->
<div style="font-family:Inter,Arial,sans-serif;color:#201F24;max-width:560px;margin:0 auto">
  <div style="background:#201F24;padding:16px 22px;border-radius:10px 10px 0 0">
    <span style="color:#ffffff;font-weight:700;font-size:18px">RampRate</span>
    <span style="color:#A454FF;font-size:18px"> Client Portal</span>
  </div>
  <div style="border:1px solid #e5e7eb;border-top:0;padding:24px;border-radius:0 0 10px 10px">
    <h2 style="margin:0 0 12px">Reset your password</h2>
    <p style="line-height:1.6">We received a request to reset the password for your portal account. If this was you, use
      the button below.</p>
    <p style="margin:24px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/set-password"
        style="background:#7E32D4;color:#ffffff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600">Choose
        a new password</a>
    </p>
    <p style="font-size:13px;color:#666">If you did not ask for this, you can ignore this email. Your password stays the
      same.</p>
  </div>
</div>
